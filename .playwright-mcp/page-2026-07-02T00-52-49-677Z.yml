            - generic [ref=e341]:
              - generic [ref=e342]: Overview
              - paragraph [ref=e343]: A personal knowledge system for short-form media. Send it an Instagram or TikTok reel, a web link, or a PDF. It transcribes, summarizes, and files each item under a life category, then resurfaces it from a searchable, mapped archive built for fast retrieval. Launched to 10+ private-beta users, with classification accuracy and the review workflow refined from real usage.
            - generic [ref=e344]:
              - generic [ref=e345]: Implementation
              - paragraph [ref=e346]: A Vercel serverless API passes incoming media to a Render worker that strips out video frames and audio. Claude reads each item and returns structured data, Mapbox geocodes any locations onto a map, and Supabase with PostGIS stores the results. The front end runs on React and Vite.
