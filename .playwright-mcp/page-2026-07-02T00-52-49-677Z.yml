          - generic [ref=e69]: About Me
        - paragraph [ref=e70]: Hello! My name is Kaden and I'm currently pursuing a B.A. in Political Science at the University of California, Santa Barbara, with a minor in Philosophy. After I graduate, I plan to attend law school and build a career in corporate law.
        - paragraph [ref=e71]: Campus life has been a big part of my UCSB experience. I'm a member of the Pre-Law Society and Phi Alpha Delta law fraternity, and I find a lot of community in the Vietnamese Student Association. When I'm not studying, I stay active on the volleyball court, in the weight room, or boxing with the Strikers Club.
        - paragraph [ref=e72]: Outside the classroom, I've led youth organizations, competed in parliamentary debate, and organized a cross-border fundraiser for Colombian youth programs. I'm passionate about community volunteering and have extensive experience in customer service.
        - paragraph [ref=e73]: I also spend a lot of my time building software. Most of my projects start as tools I wish existed and grow into full applications. I taught myself to code and work hand in hand with AI, using Claude to design, build, and ship each one end to end.
